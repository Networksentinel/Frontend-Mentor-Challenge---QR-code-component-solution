<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lets have a look how I can handle a Frontend Mentor challenge. The goal is to build a QR code component and make it as close as possible to the design provided.">
  <meta name="author" content="Michael, The Network Sentinel">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | QR code component</title>
</head>

<body>

  <main>

    <section class="card">
      <img src="/images/qr-code.webp" alt="The QR code image linked to the Frontend Mentor website" class="qr-code">
      <h1>Improve your front-end skills by building projects</h1>
      <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </section>

  </main>
  
  <footer>
    <div class="attribution">
      <h3>Challenge by</h3> <h2><a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.</h2>
      <h3>Coded by</h3> <h2><a href="#">Michael, TNS</a>.</h2>
    </div>
  </footer>
  
</body>
</html>
